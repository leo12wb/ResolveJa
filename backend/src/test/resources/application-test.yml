spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 2525
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  error:
    include-stacktrace: never
    include-message: always

jwt:
  secret: test-secret-key-min-256-bits-for-hs256-do-not-use-in-production-123456
  expiration-ms: 3600000

cors:
  allowed-origins: http://localhost:5173

logging:
  level:
    io.fixfirst.resolveja: WARN
    org.springframework.security: WARN
    org.flywaydb: WARN
