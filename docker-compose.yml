version: '3.9'

services:

  db:
    image: postgres:16-alpine
    container_name: resolveja_db
    environment:
      POSTGRES_DB: resolveja
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - resolveja_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d resolveja"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resolveja_app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/resolveja
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - resolveja_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resolveja_frontend
    volumes:
      - frontend_dist:/shared-dist
    networks:
      - resolveja_net

  nginx:
    image: nginx:1.27-alpine
    container_name: resolveja_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - app
      - frontend
    networks:
      - resolveja_net
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_dist:

networks:
  resolveja_net:
    driver: bridge
